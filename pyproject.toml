[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-loop"
version = "0.1.0"
description = "Generalize the autoresearch loop to any quantifiable optimization task"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
    "anthropic>=0.20",
]

[project.scripts]
optimization-loop = "optimization_loop.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
